<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Bank - Банк Алмазной Руды</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; }
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .modal-enter { animation: modalFade 0.3s ease-out forwards; }
        @keyframes modalFade { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        /* НАСТОЯЩИЙ 3D MINECRAFT БЛОК */
        .mc-scene { 
            perspective: 800px; 
            margin: 0 auto; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        .mc-block { 
            width: var(--size); 
            height: var(--size); 
            position: relative; 
            transform-style: preserve-3d; 
            animation: spinBlock var(--speed, 6s) infinite linear; 
        }
        .mc-face { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            /* Ссылка на текстуру руды */
            background-image: url('https://minecraft.wiki/images/Diamond_Ore_%28texture%29_JE5_BE5.png'); 
            background-size: cover; 
            image-rendering: pixelated; /* Делает пиксели четкими! */
            box-shadow: inset 0 0 15px rgba(0,0,0,0.6); /* Тени по краям блока */
            border: 1px solid rgba(0,0,0,0.1);
        }
        /* Расставляем грани по сторонам куба в зависимости от размера */
        .mc-front  { transform: translateZ(calc(var(--size) / 2)); } 
        .mc-back   { transform: rotateY(180deg) translateZ(calc(var(--size) / 2)); }
        .mc-right  { transform: rotateY(90deg) translateZ(calc(var(--size) / 2)); } 
        .mc-left   { transform: rotateY(-90deg) translateZ(calc(var(--size) / 2)); }
        .mc-top    { transform: rotateX(90deg) translateZ(calc(var(--size) / 2)); } 
        .mc-bottom { transform: rotateX(-90deg) translateZ(calc(var(--size) / 2)); }
        
        /* Анимация вращения (с наклоном как дроп в майнкрафте) */
        @keyframes spinBlock { 
            0% { transform: rotateX(-20deg) rotateY(0deg); } 
            100% { transform: rotateX(-20deg) rotateY(360deg); } 
        }
    </style>
</head>
<body class="text-slate-800">

    <!-- ЭКРАН ВХОДА -->
    <div id="auth-screen" class="min-h-screen flex items-center justify-center fade-in">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-96 text-center border-t-4 border-blue-600">
            
            <!-- 3D Блок руды -->
            <div class="mc-scene mb-8" style="--size: 80px; --speed: 8s;">
                <div class="mc-block">
                    <div class="mc-face mc-front"></div><div class="mc-face mc-back"></div>
                    <div class="mc-face mc-right"></div><div class="mc-face mc-left"></div>
                    <div class="mc-face mc-top"></div><div class="mc-face mc-bottom"></div>
                </div>
            </div>
            
            <h1 class="text-3xl font-bold text-blue-900 mb-2">AR Bank</h1>
            <p class="text-slate-500 mb-8">Войдите для управления счетом</p>
            
            <input id="login-user" type="text" placeholder="Никнейм в игре" class="w-full mb-4 px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50">
            <input id="login-pass" type="password" placeholder="Пароль" class="w-full mb-6 px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50">
            
            <button id="btn-login" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition shadow-lg mb-4">Войти</button>
            <div class="text-sm text-slate-500">
                Нет аккаунта? <button onclick="toggleModal('register-modal', true)" class="text-blue-600 font-bold hover:underline">Создать счет</button>
            </div>
            <p id="login-error" class="text-red-500 mt-4 text-sm hidden font-medium"></p>
        </div>
    </div>

    <!-- ВСПЛЫВАЮЩЕЕ ОКНО РЕГИСТРАЦИИ -->
    <div id="register-modal" class="fixed inset-0 bg-slate-900 bg-opacity-60 flex items-center justify-center hidden z-50 transition-opacity">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-96 modal-enter relative">
            <button onclick="toggleModal('register-modal', false)" class="absolute top-4 right-4 text-slate-400 hover:text-slate-700 text-2xl font-bold">&times;</button>
            <h2 class="text-2xl font-bold text-slate-800 mb-2">Регистрация</h2>
            <p class="text-sm text-slate-500 mb-6">Создайте свой банковский счет для АР</p>

            <input id="reg-user" type="text" placeholder="Ваш ник в игре (точно как на сервере)" class="w-full mb-4 px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 bg-slate-50">
            <input id="reg-pass" type="password" placeholder="Придумайте пароль (от 6 символов)" class="w-full mb-6 px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 bg-slate-50">

            <button id="btn-register" class="w-full bg-emerald-500 text-white font-bold py-3 rounded-lg hover:bg-emerald-600 transition shadow-md">Зарегистрироваться</button>
            <p id="reg-error" class="mt-4 text-sm text-center hidden font-medium"></p>
        </div>
    </div>

    <!-- ЭКРАН УПРАВЛЕНИЯ БАНКОМ -->
    <div id="bank-screen" class="hidden min-h-screen fade-in">
        <!-- Шапка -->
        <header class="bg-blue-700 text-white shadow-md">
            <div class="max-w-5xl mx-auto px-6 py-3 flex justify-between items-center">
                <div class="flex items-center gap-4">
                    <!-- Маленький 3D Блок в шапке -->
                    <div class="mc-scene" style="--size: 32px; --speed: 12s;">
                        <div class="mc-block">
                            <div class="mc-face mc-front"></div><div class="mc-face mc-back"></div>
                            <div class="mc-face mc-right"></div><div class="mc-face mc-left"></div>
                            <div class="mc-face mc-top"></div><div class="mc-face mc-bottom"></div>
                        </div>
                    </div>
                    <h2 class="text-xl font-bold tracking-wide">AR Bank</h2>
                </div>
                <div class="flex items-center gap-4">
                    <!-- Аватарка игрока (подгружается автоматически) -->
                    <div class="flex items-center gap-3 bg-blue-800 px-4 py-2 rounded-lg border border-blue-600 shadow-inner">
                        <img id="player-avatar" src="" alt="Head" class="w-8 h-8 rounded-md bg-blue-900 shadow">
                        <span id="welcome-text" class="font-medium tracking-wide">Загрузка...</span>
                    </div>
                    <button id="btn-logout" class="bg-slate-100 text-slate-700 font-bold px-4 py-2 rounded-lg hover:bg-white transition shadow">Выход</button>
                </div>
            </div>
        </header>

        <div class="max-w-5xl mx-auto px-6 py-8 grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="md:col-span-2 space-y-6">
                <!-- Баланс -->
                <div class="bg-white rounded-2xl shadow-lg p-8 border-l-8 border-blue-500 relative overflow-hidden">
                    <!-- Огромный блок на заднем фоне -->
                    <div class="absolute -right-16 -top-16 opacity-10 pointer-events-none">
                        <div class="mc-scene" style="--size: 250px; --speed: 30s;">
                            <div class="mc-block">
                                <div class="mc-face mc-front"></div><div class="mc-face mc-back"></div>
                                <div class="mc-face mc-right"></div><div class="mc-face mc-left"></div>
                                <div class="mc-face mc-top"></div><div class="mc-face mc-bottom"></div>
                            </div>
                        </div>
                    </div>

                    <p class="text-slate-500 text-sm font-semibold uppercase tracking-wider mb-1 relative z-10">Доступный баланс</p>
                    <div class="flex items-end gap-2 relative z-10">
                        <span id="balance-amount" class="text-6xl font-extrabold text-slate-800 tracking-tight">0</span>
                        <span class="text-3xl text-blue-600 font-bold mb-1">АР</span>
                    </div>
                </div>
                
                <!-- Перевод -->
                <div class="bg-white rounded-2xl shadow-lg p-8">
                    <h3 class="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2">
                        <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
                        Перевод средств
                    </h3>
                    <div class="flex gap-4 mb-4">
                        <div class="w-1/2 relative">
                            <input id="transfer-receiver" type="text" placeholder="Ник получателя" class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-blue-500 bg-slate-50">
                        </div>
                        <div class="w-1/2 relative">
                            <input id="transfer-amount" type="number" placeholder="Сумма АР" class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-blue-500 bg-slate-50">
                        </div>
                    </div>
                    <div class="flex justify-between items-center mb-6 px-1">
                        <span class="text-sm text-slate-500">Комиссия банка:</span>
                        <span id="commission-rate" class="font-bold text-blue-600 bg-blue-50 px-2 py-1 rounded">5%</span>
                    </div>
                    <button id="btn-transfer" class="w-full bg-blue-600 text-white font-bold text-lg py-4 rounded-xl hover:bg-blue-700 transition shadow-lg transform active:scale-[0.98]">Подтвердить перевод</button>
                    <p id="transfer-msg" class="mt-4 text-sm text-center font-medium"></p>
                </div>
            </div>
            
            <!-- История -->
            <div class="bg-white rounded-2xl shadow-lg p-6 flex flex-col" style="height: 520px;">
                <h3 class="text-xl font-bold text-slate-800 mb-4 pb-2 border-b">История операций</h3>
                <div id="history-list" class="flex-1 overflow-y-auto space-y-3 pr-2 text-sm text-slate-600 scrollbar-thin">
                    <!-- Загрузка истории -->
                </div>
            </div>
        </div>

        <!-- АДМИН ПАНЕЛЬ -->
        <div id="admin-panel" class="hidden max-w-5xl mx-auto px-6 pb-12 fade-in">
            <div class="bg-slate-900 rounded-2xl shadow-2xl p-8 text-white border-t-4 border-emerald-500">
                <h3 class="text-xl font-bold text-emerald-400 mb-6 border-b border-slate-700 pb-3 flex items-center gap-2">
                    <span class="text-2xl">⚡</span> Панель Управления Банкира
                </h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
                    <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
                        <h4 class="font-semibold mb-4 text-slate-300">Начислить АР на счет</h4>
                        <input id="admin-user" type="text" placeholder="Точный ник игрока" class="w-full mb-3 px-4 py-3 border border-slate-600 rounded-lg bg-slate-900 text-white focus:border-emerald-500 outline-none">
                        <input id="admin-amount" type="number" placeholder="Количество" class="w-full mb-4 px-4 py-3 border border-slate-600 rounded-lg bg-slate-900 text-white focus:border-emerald-500 outline-none">
                        <button id="btn-topup" class="w-full bg-emerald-600 font-bold py-3 rounded-lg hover:bg-emerald-500 transition">Выполнить начисление</button>
                    </div>
                    <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
                        <h4 class="font-semibold mb-4 text-slate-300">Управление комиссией (%)</h4>
                        <div class="flex items-center gap-6 mb-8 mt-6">
                            <input id="admin-comm-slider" type="range" min="0" max="30" step="1" value="5" class="w-full h-2 bg-slate-600 rounded-lg appearance-none cursor-pointer">
                            <span id="comm-val" class="font-bold text-3xl text-emerald-400 w-16 text-right">5%</span>
                        </div>
                        <button id="btn-commission" class="w-full bg-blue-600 font-bold py-3 rounded-lg hover:bg-blue-500 transition mt-2">Применить новые правила</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- FIREBASE И ЛОГИКА -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, addDoc, query, where, getDocs, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB3unvYcGKFLk6RDTl1t39_P4NZMqJxkE8",
            authDomain: "bank-system-a45ec.firebaseapp.com",
            projectId: "bank-system-a45ec",
            storageBucket: "bank-system-a45ec.firebasestorage.app",
            messagingSenderId: "860974102580",
            appId: "1:860974102580:web:7dedaa06461012937d3261"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUserDoc = null;
        let globalCommission = 5;

        // Открытие/закрытие модального окна
        window.toggleModal = (id, show) => {
            const el = document.getElementById(id);
            if(show) { el.classList.remove('hidden'); document.getElementById('reg-error').style.display='none'; }
            else el.classList.add('hidden');
        };

        const getEmail = (user) => `${user.toLowerCase()}@arbank.ru`;
        const showErr = (id, msg, success=false) => {
            const el = document.getElementById(id);
            el.innerText = msg;
            el.className = `mt-3 text-sm text-center font-medium block ${success ? 'text-emerald-500' : 'text-red-500'}`;
            el.style.display = 'block';
            if(success) setTimeout(() => el.style.display = 'none', 4000);
        };

        async function loadBankSettings() {
            const settingsSnap = await getDoc(doc(db, "settings", "bank"));
            if (settingsSnap.exists()) globalCommission = settingsSnap.data().commission;
            else await setDoc(doc(db, "settings", "bank"), { commission: 5 });
            
            document.getElementById('commission-rate').innerText = globalCommission + '%';
            document.getElementById('admin-comm-slider').value = globalCommission;
            document.getElementById('comm-val').innerText = globalCommission + '%';
        }

        // Регистрация
        document.getElementById('btn-register').onclick = async () => {
            const u = document.getElementById('reg-user').value.trim();
            const p = document.getElementById('reg-pass').value;
            if (u.length < 3 || p.length < 6) return showErr('reg-error', 'Ник от 3 букв, пароль от 6.');
            try {
                const docSnap = await getDoc(doc(db, "users", u.toLowerCase()));
                if (docSnap.exists()) return showErr('reg-error', 'Счет с таким ником уже существует!');
                
                await createUserWithEmailAndPassword(auth, getEmail(u), p);
                await setDoc(doc(db, "users", u.toLowerCase()), { username: u, balance: 0, role: 'player' });
                showErr('reg-error', 'Счет успешно создан! Выполняем вход...', true);
                setTimeout(() => toggleModal('register-modal', false), 1500);
            } catch (e) { showErr('reg-error', 'Ошибка. Пароль слишком простой или ник занят.'); }
        };

        // Вход
        document.getElementById('btn-login').onclick = async () => {
            const u = document.getElementById('login-user').value.trim();
            const p = document.getElementById('login-pass').value;
            if (!u || !p) return showErr('login-error', 'Заполните все поля');
            try { await signInWithEmailAndPassword(auth, getEmail(u), p); } 
            catch (e) { showErr('login-error', 'Неверный ник или пароль.'); }
        };

        // Выход
        document.getElementById('btn-logout').onclick = () => { signOut(auth); location.reload(); };

        // Состояние входа
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('bank-screen').classList.remove('hidden');
                const usernameId = user.email.split('@')[0];
                
                const docSnap = await getDoc(doc(db, "users", usernameId));
                if (docSnap.exists()) {
                    currentUserDoc = docSnap.data();
                    document.getElementById('welcome-text').innerText = currentUserDoc.username;
                    document.getElementById('balance-amount').innerText = currentUserDoc.balance.toFixed(2);
                    
                    document.getElementById('player-avatar').src = `https://minotar.net/helm/${currentUserDoc.username}/100.png`;
                    
                    if(currentUserDoc.role === 'banker') document.getElementById('admin-panel').classList.remove('hidden');
                }
                loadBankSettings();
                loadHistory();
            } else {
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('bank-screen').classList.add('hidden');
            }
        });

        // Перевод
        document.getElementById('btn-transfer').onclick = async () => {
            if (!currentUserDoc) return;
            const receiverRaw = document.getElementById('transfer-receiver').value.trim();
            const amount = parseFloat(document.getElementById('transfer-amount').value);
            const receiverId = receiverRaw.toLowerCase();
            const senderId = currentUserDoc.username.toLowerCase();

            if (amount <= 0 || !amount) return showErr('transfer-msg', 'Введите корректную сумму.');
            if (receiverId === senderId) return showErr('transfer-msg', 'Нельзя перевести самому себе.');

            const commissionAmount = amount * (globalCommission / 100);
            const totalDeduction = amount + commissionAmount;

            const btn = document.getElementById('btn-transfer');
            btn.disabled = true;
            btn.innerText = 'Обработка...';

            try {
                await runTransaction(db, async (transaction) => {
                    const senderRef = doc(db, "users", senderId);
                    const receiverRef = doc(db, "users", receiverId);
                    const senderSnap = await transaction.get(senderRef);
                    const receiverSnap = await transaction.get(receiverRef);

                    if (!receiverSnap.exists()) throw "Счет получателя не найден!";
                    if (senderSnap.data().balance < totalDeduction) throw `Недостаточно средств (комиссия ${globalCommission}%)`;

                    transaction.update(senderRef, { balance: senderSnap.data().balance - totalDeduction });
                    transaction.update(receiverRef, { balance: receiverSnap.data().balance + amount });
                    
                    const txRef = doc(collection(db, "transactions"));
                    transaction.set(txRef, { sender: senderSnap.data().username, receiver: receiverSnap.data().username, amount, date: Date.now() });
                });
                showErr('transfer-msg', 'АР успешно переведены!', true);
                document.getElementById('transfer-receiver').value = '';
                document.getElementById('transfer-amount').value = '';
                
                const newSnap = await getDoc(doc(db, "users", senderId));
                document.getElementById('balance-amount').innerText = newSnap.data().balance.toFixed(2);
                loadHistory();
            } catch (e) { showErr('transfer-msg', e); }
            finally {
                btn.disabled = false;
                btn.innerText = 'Подтвердить перевод';
            }
        };

        // История
        async function loadHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = '<div class="text-center mt-10"><span class="animate-pulse">Загрузка данных...</span></div>';
            
            const q1 = query(collection(db, "transactions"), where("sender", "==", currentUserDoc.username));
            const q2 = query(collection(db, "transactions"), where("receiver", "==", currentUserDoc.username));
            
            const [snap1, snap2] = await Promise.all([getDocs(q1), getDocs(q2)]);
            const txs = [...snap1.docs, ...snap2.docs].map(d => d.data()).sort((a,b) => b.date - a.date);

            list.innerHTML = '';
            if (txs.length === 0) list.innerHTML = '<p class="text-center text-slate-400 mt-4">Операций пока нет</p>';
            
            txs.forEach(tx => {
                const isIncoming = tx.receiver === currentUserDoc.username;
                const color = isIncoming ? 'text-emerald-600 bg-emerald-50' : 'text-slate-700 bg-slate-50';
                const sign = isIncoming ? '+' : '-';
                const otherUser = isIncoming ? tx.sender : tx.receiver;
                // Иконка руды для Банка, или голова для игрока
                const headImg = otherUser === "BANK" ? "https://minecraft.wiki/images/Diamond_Ore_%28texture%29_JE5_BE5.png" : `https://minotar.net/helm/${otherUser}/50.png`;

                list.innerHTML += `
                    <div class="p-4 rounded-xl border border-slate-100 flex justify-between items-center mb-3 ${color} shadow-sm">
                        <div class="flex items-center gap-3">
                            <img src="${headImg}" class="w-10 h-10 rounded shadow-sm" style="image-rendering: pixelated;">
                            <div>
                                <p class="font-bold text-sm">${isIncoming ? 'От: '+tx.sender : 'Кому: '+tx.receiver}</p>
                                <p class="text-xs opacity-70 mt-0.5">${new Date(tx.date).toLocaleString([], {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'})}</p>
                            </div>
                        </div>
                        <span class="font-bold text-lg">${sign}${tx.amount} АР</span>
                    </div>`;
            });
        }

        // Админка
        document.getElementById('admin-comm-slider').oninput = (e) => document.getElementById('comm-val').innerText = e.target.value + '%';

        document.getElementById('btn-commission').onclick = async () => {
            if (currentUserDoc.role !== 'banker') return;
            const newComm = parseInt(document.getElementById('admin-comm-slider').value);
            await setDoc(doc(db, "settings", "bank"), { commission: newComm });
            alert('Комиссия обновлена!');
            loadBankSettings();
        };

        document.getElementById('btn-topup').onclick = async () => {
            if (currentUserDoc.role !== 'banker') return;
            const userRaw = document.getElementById('admin-user').value.trim().toLowerCase();
            const amount = parseFloat(document.getElementById('admin-amount').value);
            
            if(!userRaw || !amount) return alert('Введите ник и сумму');
            try {
                const userRef = doc(db, "users", userRaw);
                const userSnap = await getDoc(userRef);
                if (!userSnap.exists()) return alert('Счет игрока не найден (пусть зарегистрируется на сайте)');
                
                await updateDoc(userRef, { balance: userSnap.data().balance + amount });
                await addDoc(collection(db, "transactions"), { sender: "BANK", receiver: userSnap.data().username, amount, date: Date.now() });
                
                alert(`Успешно начислено ${amount} АР игроку ${userSnap.data().username}!`);
                document.getElementById('admin-user').value = '';
                document.getElementById('admin-amount').value = '';
            } catch (e) { alert('Ошибка: ' + e.message); }
        };
    </script>
</body>
</html>
